name: ci
# Manual for now: the code targets macOS 26 / iOS 26 and hosted macOS runners may not have that SDK yet.
# Switch `runs-on` to a runner with the macOS 26 SDK and re-enable the push/pull_request triggers when available.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Core tests
        run: ./build.sh --test
